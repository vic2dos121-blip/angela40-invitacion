<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ángela 40</title>
<meta property="og:title" content="Ángela cumple 40">
<meta property="og:site_name" content="Invitación">
<meta property="og:url" content="https://vic2dos121-blip.github.io/angela40-invitacion/">
<meta property="og:image" content="https://vic2dos121-blip.github.io/angela40-invitacion/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono.png">
<meta property="og:description" content="Viernes 9 de octubre, 21:30 h · Hacienda El Arenoso, Dos Hermanas">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2b1512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&family=Jost:wght@300;400;500;600&family=Poppins:wght@200;300&display=swap">

<style>
  :root {
    /* 1 unidad = 1 px en un móvil de 390x780. Nunca pasa de 1.5 para no reventar en pantalla grande */
    --k: min(100vw / 390, 100vh / 840, 1.5px);
    --fondo:  #2b1512;
    --clara:  #fff1ea;
    --suave:  #fbded4;
    --brasa:  #ffb49d;
    --tenue:  #e5ab99;
  }
  @supports (height: 100svh) {
    :root { --k: min(100vw / 390, 100svh / 840, 1.5px); }
  }
  @supports (height: 100dvh) {
    :root { --k: min(100vw / 390, 100dvh / 840, 1.5px); }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--fondo);
  }

  body {
    font-family: "Jost", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    color: var(--clara);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- el fondo ---------- */
  .lienzo {
    position: fixed; inset: 0; z-index: 0;
    background: var(--fondo);
  }
  .lienzo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(72% 46% at 50% 4%,   rgba(255,141,110,.60) 0%, rgba(214,86,60,.28) 44%, rgba(43,21,18,0) 78%),
      radial-gradient(96% 62% at 50% 102%, rgba(122,40,28,.62) 0%, rgba(43,21,18,0) 72%);
  }
  #polvo {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ---------- la tarjeta ---------- */
  .carta {
    position: fixed; inset: 0; z-index: 2;
    display: flex; justify-content: center;
    padding-top: calc(var(--k) * 30 + env(safe-area-inset-top, 0px));
    padding-bottom: calc(var(--k) * 28 + env(safe-area-inset-bottom, 0px));
    padding-inline: calc(var(--k) * 24);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    text-align: center;
    text-shadow: 0 calc(var(--k) * 2) calc(var(--k) * 14) rgba(26,8,6,.7);
  }
  .dentro {
    width: 100%;
    max-width: calc(var(--k) * 430);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: calc(var(--k) * 18);
    margin: auto 0;
  }
  .dentro > * { margin: 0; }

  .nombre {
    font-family: "Sacramento", "Snell Roundhand", cursive;
    font-size: calc(var(--k) * 92);
    line-height: 1.18;
    color: var(--clara);
  }

  .cifra {
    font-family: "Poppins", "Jost", sans-serif;
    font-weight: 300;
    font-size: calc(var(--k) * 116);
    line-height: 1;
    letter-spacing: .04em;
    color: var(--clara);
    text-shadow: none;
    filter: drop-shadow(0 calc(var(--k) * 3) calc(var(--k) * 16) rgba(26,8,6,.55));
  }
  .cifra .brillo {
    background-image: linear-gradient(105deg,
      #fff1ea 0%, #fff1ea 30%, #ffd0bd 38%, #ff9f80 50%, #ffd0bd 62%, #fff1ea 70%, #fff1ea 100%);
    background-size: 260% 100%;
    background-position: 0 0;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: destello 4.6s cubic-bezier(.45,0,.55,1) infinite;
  }
  @keyframes destello {
    0%       { background-position: 0 0; }
    80%, 100%{ background-position: 100% 0; }
  }

  .invito {
    font-size: calc(var(--k) * 17);
    font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: var(--suave);
  }

  .cuando { display: flex; align-items: center; justify-content: center; gap: calc(var(--k) * 20); }
  .cuando span {
    font-size: calc(var(--k) * 17.5);
    font-weight: 600; letter-spacing: .15em; text-transform: uppercase;
    color: var(--suave);
  }
  .cuando .dia { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .cuando .dia small { font-size: calc(var(--k) * 15); font-weight: 600; letter-spacing: .16em; }
  .cuando .dia big {
    font-size: calc(var(--k) * 48); font-weight: 600; letter-spacing: .02em;
    margin-top: calc(var(--k) * 3); color: var(--brasa);
  }
  .raya { width: 1px; height: calc(var(--k) * 58); background: rgba(255,214,199,.7); }

  .donde { display: flex; flex-direction: column; gap: calc(var(--k) * 9); }
  .donde .sitio {
    font-size: calc(var(--k) * 19);
    font-weight: 600; letter-spacing: .11em; text-transform: uppercase;
    line-height: 1.3; color: var(--clara);
  }
  .donde .calle {
    font-size: calc(var(--k) * 14.5);
    font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
    line-height: 1.65; color: var(--suave);
    text-wrap: balance;
  }

  .confirma {
    font-size: calc(var(--k) * 14);
    font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
    line-height: 1.6; color: var(--tenue);
    text-wrap: balance;
  }

  .acciones {
    display: flex; flex-direction: row; flex-wrap: nowrap;
    align-items: stretch; justify-content: center;
    gap: calc(var(--k) * 9);
    width: 100%;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: calc(var(--k) * 6);
    padding: calc(var(--k) * 12) calc(var(--k) * 13);
    border-radius: 999px;
    font-size: calc(var(--k) * 12);
    font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    text-decoration: none; border: 1px solid transparent;
    text-shadow: none;
    white-space: nowrap;
    flex: 0 1 auto;
    -webkit-tap-highlight-color: transparent;
  }
  .btn svg { flex: none; width: calc(var(--k) * 14); height: calc(var(--k) * 14); }
  .btn--mapa   { background: linear-gradient(180deg, #ffc2ad 0%, #e07a5f 100%); color: #3b1a14; }
  .btn--agenda { background: rgba(43,21,18,.55); color: #ffd6c7; border-color: rgba(255,180,157,.62); }
  .btn:focus-visible { outline: 2px solid var(--brasa); outline-offset: 3px; }

  /* ---------- las letras van saliendo ---------- */
  .sale { opacity: 0; transform: translateY(calc(var(--k) * 14)); }
  .listo .sale { animation: asomar .9s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes asomar {
    from { opacity: 0; transform: translateY(calc(var(--k) * 14)); }
    to   { opacity: 1; transform: none; }
  }
  .listo .s1 { animation-delay: .10s; }
  .listo .s2 { animation-delay: .32s; }
  .listo .s3 { animation-delay: .54s; }
  .listo .s4 { animation-delay: .72s; }
  .listo .s5 { animation-delay: .90s; }
  .listo .s6 { animation-delay: 1.06s; }
  .listo .s7 { animation-delay: 1.22s; }
</style>
</head>
<body>

<div class="lienzo"></div>
<canvas id="polvo" aria-hidden="true"></canvas>

<main class="carta">
  <div class="dentro">
    <h1 class="nombre sale s1">Ángela</h1>
    <p class="cifra sale s2"><span class="brillo">40</span></p>
    <p class="invito sale s3">Te invito a celebrarlo</p>
    <p class="cuando sale s4">
      <span>Viernes</span>
      <span class="raya"></span>
      <span class="dia"><small>OCT</small><big>9</big></span>
      <span class="raya"></span>
      <span>21:30 h</span>
    </p>
    <p class="donde sale s5">
      <span class="sitio">Hacienda El Arenoso</span>
      <span class="calle">Ctra. Acueducto de San Juan, km 2 · Dos Hermanas</span>
    </p>
    <p class="confirma sale s6">Confírmame antes del 30 de septiembre</p>
    <p class="acciones sale s7">
      <a class="btn btn--mapa" target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&amp;query=Hacienda+El+Arenoso+Dos+Hermanas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        Cómo llegar
      </a>
      <a class="btn btn--agenda" target="_blank" rel="noopener"
         href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Cumple%20de%20%C3%81ngela%20(40)&amp;dates=20261009T213000/20261010T020000&amp;ctz=Europe/Madrid&amp;location=Hacienda%20El%20Arenoso%2C%20Ctra.%20Acueducto%20de%20San%20Juan%2C%20km%202%2C%2041700%20Dos%20Hermanas&amp;details=%C2%A1Cumplo%2040!%20Te%20espero%20en%20la%20Hacienda%20El%20Arenoso.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>
        Guardar fecha
      </a>
    </p>
  </div>
</main>

<script>
/* las letras asoman en cuanto la página está lista */
document.body.classList.add('listo');

/* lucecitas de coral flotando */
(function () {
  var cv = document.getElementById('polvo');
  if (!cv) return;
  var cx = cv.getContext('2d');
  var W = 0, H = 0, motas = [];

  function medir() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function sembrar() {
    var cuantas = Math.round(Math.min(170, Math.max(90, W * H / 2400)));
    motas = [];
    for (var i = 0; i < cuantas; i++) {
      var plano = Math.random();
      var r = plano < .55 ? 1 + Math.random() * 2
            : plano < .9  ? 3 + Math.random() * 5
            :               14 + Math.random() * 20;
      motas.push({
        x: Math.random() * W, y: Math.random() * H, r: r,
        vy: r > 14 ? -(0.05 + Math.random() * 0.07) : -(0.18 + Math.random() * 0.35),
        vx: (Math.random() - .5) * 0.3,
        fase: Math.random() * 6.283,
        vel: 0.6 + Math.random() * 1.5,
        base: r > 14 ? 0.12 : r > 3 ? 0.4 : 0.9
      });
    }
  }

  function pintar(t) {
    cx.clearRect(0, 0, W, H);
    cx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < motas.length; i++) {
      var m = motas[i];
      m.y += m.vy; m.x += m.vx + Math.sin(t / 1200 + m.fase) * 0.18;
      if (m.y < -40) { m.y = H + 30; m.x = Math.random() * W; }
      if (m.x < -40) m.x = W + 30;
      if (m.x > W + 40) m.x = -30;
      var br = m.base * Math.max(0, Math.sin(t / 560 * m.vel + m.fase));
      if (br < 0.02) continue;
      var g = cx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 3.2);
      g.addColorStop(0,    'rgba(255,226,210,' + br + ')');
      g.addColorStop(0.35, 'rgba(255,164,132,' + (br * 0.55) + ')');
      g.addColorStop(1,    'rgba(214,96,70,0)');
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(m.x, m.y, m.r * 3.2, 0, 6.2832); cx.fill();
    }
    cx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(pintar);
  }

  var espera;
  window.addEventListener('resize', function () {
    clearTimeout(espera);
    espera = setTimeout(function () { medir(); sembrar(); }, 150);
  });

  medir(); sembrar();
  requestAnimationFrame(pintar);
})();
</script>
</body>
</html>
